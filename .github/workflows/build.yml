name: Build APK from HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4

      - name: Установить Node.js и Java 21
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Подготовить веб-файлы и Capacitor
        run: |
          mkdir -p www
          cp *.html *.css *.js www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "LupaGrams" "com.lupagrams.app" --web-dir=www
          npx cap add android

      - name: Собрать APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохранить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: LupaGrams-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
