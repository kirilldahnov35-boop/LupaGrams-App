<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telegram</title>
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-search: #f1f2f4;
      --bg-chat: #e5ebf1;
      --text-primary: #111111;
      --text-secondary: #82868a;
      --accent: #2481cc;
      --accent-light: #e5f2fc;
      --msg-in: #ffffff;
      --msg-out: #eeffde;
      --border: #f0f0f0;
      --nav-bg: rgba(255, 255, 255, 0.96);
    }

    body.dark {
      --bg-main: #18222d;
      --bg-search: #242f3d;
      --bg-chat: #0e1621;
      --text-primary: #f5f5f5;
      --text-secondary: #7f91a4;
      --accent: #5288c1;
      --accent-light: #2b5278;
      --msg-in: #182533;
      --msg-out: #2b5278;
      --border: #101921;
      --nav-bg: rgba(24, 34, 45, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100dvh;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
    }
    .screen.active {
      display: flex;
    }

    /* Верхняя шапка */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px 18px;
      background: var(--bg-main);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }
    .menu-dots {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Поиск чатов */
    .search-wrap {
      padding: 4px 14px 10px 14px;
      background: var(--bg-main);
      flex-shrink: 0;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-search);
      border-radius: 22px;
      padding: 9px 14px;
      gap: 8px;
    }
    .search-box svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-secondary);
      flex-shrink: 0;
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 16px;
      color: var(--text-primary);
    }

    /* Список чатов */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 90px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 9px 16px;
      gap: 13px;
      cursor: pointer;
    }
    .chat-item:active {
      background-color: var(--bg-search);
    }
    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 20px;
      flex-shrink: 0;
    }
    .chat-body {
      flex: 1;
      min-width: 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .chat-item:last-child .chat-body {
      border-bottom: none;
    }
    .chat-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .chat-name-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .chat-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .verified-icon {
      width: 16px;
      height: 16px;
      fill: var(--accent);
      flex-shrink: 0;
    }
    .chat-meta-right {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .checks {
      color: #4fae4e;
      font-weight: 700;
      font-size: 13px;
    }
    .chat-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .chat-preview {
      font-size: 15px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-preview.accent-text {
      color: var(--accent);
    }
    .unread-badge {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      min-width: 21px;
      height: 21px;
      padding: 0 6px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Плавающие кнопки справа */
    .fab-group {
      position: fixed;
      right: 16px;
      bottom: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .fab-small {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-main);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
    }
    .fab-main {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      box-shadow: 0 4px 12px rgba(36, 129, 204, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
    }

    /* Нижняя навигация */
    .bottom-nav {
      position: fixed;
      bottom: 8px;
      left: 10px;
      right: 10px;
      height: 64px;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 6px;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 14px;
      border-radius: 24px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
    }
    .nav-item.active {
      background: var(--accent-light);
      color: var(--accent);
    }
    .nav-badge {
      position: absolute;
      top: 3px;
      right: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      border: 1.5px solid var(--bg-main);
    }
    .profile-mini-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #4caf50;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Экран переписки */
    .dialog-header {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--accent);
      cursor: pointer;
      padding: 4px 8px;
    }
    .messages-area {
      flex: 1;
      background-color: var(--bg-chat);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .msg.in {
      background: var(--msg-in);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.out {
      background: var(--msg-out);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: right;
      margin-top: 2px;
    }
    .input-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-main);
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    .input-bar input {
      flex: 1;
      border: none;
      outline: none;
      background: var(--bg-search);
      color: var(--text-primary);
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 20px;
    }
    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Заглушки для вкладок Контакты / Настройки / Профиль */
    .tab-content {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
    }
    .tab-content.active {
      display: flex;
    }
    .settings-box {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: var(--bg-search);
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="mainScreen" class="screen active">
    <div class="top-header">
      <div class="brand-title" id="topTabTitle">Telegram</div>
      <button class="menu-dots" onclick="toggleTheme()" title="Сменить тему">⋮</button>
    </div>

    <!-- ВКЛАДКА: ЧАТЫ -->
    <div id="tabChats" class="tab-content active">
