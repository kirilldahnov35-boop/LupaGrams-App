<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LupaGrams</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #ffffff;
            --hint-color: #8b9bb4;
            --accent-color: #2ea6ff;
            --accent-hover: #2593e6;
            --error-color: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .screen {
            width: 100%;
            max-width: 360px;
            text-align: center;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .screen.hidden {
            display: none;
            opacity: 0;
        }

        /* Фирменная иконка */
        .logo-circle {
            width: 112px;
            height: 112px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(46, 166, 255, 0.2);
        }

        .logo-circle svg {
            width: 58px;
            height: 58px;
            fill: #ffffff;
            transform: translateX(-2px);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: var(--hint-color);
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 32px;
        }

        .subtitle span {
            color: var(--text-color);
            font-weight: 500;
        }

        /* Поле ввода в стиле Telegram */
        .input-wrapper {
            position: relative;
            margin-bottom: 24px;
            text-align: left;
        }

        .input-label {
            position: absolute;
            top: -8px;
            left: 12px;
            background-color: var(--bg-color);
            padding: 0 6px;
            font-size: 12px;
            color: var(--accent-color);
            font-weight: 500;
            transition: color 0.2s;
            z-index: 2;
        }

        .input-field {
            width: 100%;
            height: 54px;
            padding: 0 16px;
            background-color: transparent;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 17px;
            font-weight: 400;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #52b7ff;
        }

        .input-wrapper.error .input-field {
            border-color: var(--error-color);
            animation: shake 0.35s ease;
        }

        .input-wrapper.error .input-label {
            color: var(--error-color);
        }

        /* Кнопка Продолжить */
        .tg-button {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 50px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.15s, transform 0.1s;
            user-select: none;
        }

        .tg-button:hover {
            background-color: var(--accent-hover);
        }

        .tg-button:active {
            transform: scale(0.98);
        }

        .tg-button:disabled {
            opacity: 0.7;
            cursor: default;
            transform: none;
        }

        /* Кружок загрузки как в Telegram */
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .tg-button.loading .btn-label {
            display: none;
        }

        .tg-button.loading .spinner {
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--accent-color);
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Ввод номера -->
    <div class="screen" id="screen-phone">
        <div class="logo-circle">
            <svg viewBox="0 0 24 24">
                <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
            </svg>
        </div>

        <h1>LupaGrams</h1>
        <p class="subtitle">Введите виртуальный номер из бота<br><span>@LupaGrams_bot</span></p>

        <div class="input-wrapper" id="phone-group">
            <label class="input-label" for="phone-input">Номер телефона</label>
            <input type="tel" class="input-field" id="phone-input" value="+888 " autocomplete="off">
        </div>

        <button type="button" class="tg-button" id="btn-continue">
            <span class="btn-label">Продолжить</span>
            <div class="spinner"></div>
        </button>
    </div>

    <!-- ЭКРАН 2: Ввод кода подтверждения -->
    <div class="screen hidden" id="screen-code">
        <div class="logo-circle">
            <svg viewBox="0 0 24 24">
                <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
            </svg>
        </div>

        <h1 id="display-phone">+888 000 0000</h1>
        <p class="subtitle">Мы отправили код подтверждения в бот <span>@LupaGrams_bot</span></p>

        <div class="input-wrapper" id="code-group">
            <label class="input-label" for="code-input">Код</label>
            <input type="text" inputmode="numeric" maxlength="5" class="input-field" id="code-input" placeholder="12345" autocomplete="off">
        </div>

        <button type="button" class="tg-button" id="btn-verify">
            <span class="btn-label">Войти</span>
            <div class="spinner"></div>
        </button>

        <a class="back-link" id="btn-back">Изменить номер</a>
    </div>

    <script>
        // Инициализация Telegram Web App (если открыто внутри ТГ)
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#17212b');
            tg.setBackgroundColor('#17212b');
        }

        const phoneInput = document.getElementById('phone-input');
        const phoneGroup = document.getElementById('phone-group');
        const btnContinue = document.getElementById('btn-continue');

        const codeInput = document.getElementById('code-input');
        const codeGroup = document.getElementById('code-group');
        const btnVerify = document.getElementById('btn-verify');
        const btnBack = document.getElementById('btn-back');

        const screenPhone = document.getElementById('screen-phone');
        const screenCode = document.getElementById('screen-code');
        const displayPhone = document.getElementById('display-phone');

        // Автоматическое форматирование номера (+888 XXX XXXX)
        phoneInput.addEventListener('input', function(e) {
            phoneGroup.classList.remove('error');
            let digits = this.value.replace(/\D/g, '');
            
            if (!digits.startsWith('888')) {
                digits = '888' + digits.replace(/^8+/, '');
            }
            digits = digits.substring(0, 10);

            let formatted = '+888';
            if (digits.length > 3) {
                formatted += ' ' + digits.substring(3, 6);
            }
            if (digits.length > 6) {
                formatted += ' ' + digits.substring(6, 10);
            }
            this.value = formatted;
        });

        // Нажатие на кнопку "Продолжить"
        btnContinue.addEventListener('click', function() {
            const digits = phoneInput.value.replace(/\D/g, '');

            // Проверка, что номер введен полностью (10 цифр вместе с 888)
            if (digits.length < 10) {
                phoneGroup.classList.add('error');
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
