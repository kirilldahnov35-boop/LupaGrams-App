<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Messenger</title>
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-secondary: #f4f4f5;
      --bg-chat: #e5ebf1;
      --header-bg: #517da2;
      --header-text: #ffffff;
      --text-primary: #000000;
      --text-secondary: #707579;
      --msg-in: #ffffff;
      --msg-out: #eeffde;
      --accent: #3390ec;
      --border: #dfe1e5;
    }

    body.dark {
      --bg-main: #17212b;
      --bg-secondary: #0e1621;
      --bg-chat: #0e1621;
      --header-bg: #17212b;
      --header-text: #ffffff;
      --text-primary: #f5f5f5;
      --text-secondary: #7f91a4;
      --msg-in: #182533;
      --msg-out: #2b5278;
      --accent: #6ab2f2;
      --border: #0e1621;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100dvh;
      overflow: hidden;
    }

    /* Экраны */
    .screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* Шапка */
    .header {
      background-color: var(--header-bg);
      color: var(--header-text);
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-title {
      font-size: 18px;
      font-weight: 500;
    }
    .header-subtitle {
      font-size: 12px;
      opacity: 0.8;
    }
    .icon-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    /* Поиск */
    .search-bar {
      padding: 8px 12px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
    }
    .search-bar input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
    }

    /* Список чатов */
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .chat-item:active {
      background-color: var(--bg-secondary);
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5ca8f6, #2c78d4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 18px;
      flex-shrink: 0;
    }
    .chat-info {
      flex: 1;
      min-width: 0;
    }
    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .chat-name {
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-time {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .chat-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-last-msg {
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
    }

    /* Окно чата */
    .messages-area {
      flex: 1;
      background-color: var(--bg-chat);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.35;
      position: relative;
      word-wrap: break-word;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }
    .msg.in {
      background-color: var(--msg-in);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.out {
      background-color: var(--msg-out);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-meta {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: right;
      margin-top: 3px;
    }

    /* Поле ввода */
    .input-bar {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: var(--bg-main);
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    .input-bar input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      padding: 6px;
    }
    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: СПИСОК ЧАТОВ -->
  <div id="chatsScreen" class="screen active">
    <div class="header">
      <div class="header-left">
        <button class="icon-btn" onclick="toggleTheme()" title="Сменить тему">🌓</button>
        <span class="header-title">Telegram</span>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Поиск" oninput="filterChats(this.value)" />
    </div>

    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- ЭКРАН 2: ПЕРЕПИСКА -->
  <div id="dialogScreen" class="screen">
    <div class="header">
      <div class="header-left">
        <button class="icon-btn" onclick="closeChat()">←</button>
        <div class="avatar" id="dialogAvatar" style="width:38px;height:38px;font-size:15px;">А</div>
        <div>
          <div class="header-title" id="dialogName">Имя</div>
          <div class="header-subtitle" id="dialogStatus">в сети</div>
        </div>
      </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <form class="input-bar" onsubmit="handleSendMessage(event)">
      <input type="text" id="messageInput" placeholder="Сообщение" autocomplete="off" />
      <button type="submit" class="send-btn">➤</button>
    </form>
  </div>

  <script>
    // Демо-данные (замените на загрузку с вашего бэкенда)
    const chatsData = [
      {
        id: 1,
        name: "Избранное",
        status: "облачное хранилище",
        unread: 0,
        messages: [
          { text: "Сохраненная заметка", type: "out", time: "12:00" }
        ]
      },
      {
        id: 2,
        name: "Алексей",
        status: "был(а) недавно",
        unread: 2,
        messages: [
          { text: "Привет! Как продвигается проект?", type: "in", time: "14:05" },
          { text: "Интерфейс почти готов!", type: "out", time: "14:06" }
        ]
      }
    ];

    let currentChatId = null;

    function renderChats(list = chatsData) {
      const container = document.getElementById("chatList");
      container.innerHTML = "";
      list.forEach(chat => {
        const lastMsg = chat.messages[chat.messages.length - 1];
        const el = document.createElement("div");
        el.className = "chat-item";
        el.onclick = () => openChat(chat.id);
        el.innerHTML = `
          <div class="avatar">${chat.name[0].toUpperCase()}</div>
          <div class="chat-info">
            <div class="chat-top">
              <span class="chat-name">${chat.name}</span>
              <span class="chat-time">${lastMsg ? lastMsg.time : ""}</span>
            </div>
            <div class="chat-bottom">
              <span class="chat-last-msg">${lastMsg ? lastMsg.text : "Нет сообщений"}</span>
              ${chat.unread > 0 ? `<span class="badge">${chat.unread}</span>` : ""}
            </div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function openChat(id) {
      currentChatId = id;
      const chat = chatsData.find(c => c.id === id);
      chat.unread = 0;

      document.getElementById("dialogName").textContent = chat.name;
      document.getElementById("dialogStatus").textContent = chat.status;
      document.getElementById("dialogAvatar").textContent = chat.name[0].toUpperCase();

      renderMessages(chat.messages);
      document.getElementById("chatsScreen").classList.remove("active");
      document.getElementById("dialogScreen").classList.add("active");
    }

    function closeChat() {
      currentChatId = null;
      document.getElementById("dialogScreen").classList.remove("active");
      document.getElementById("chatsScreen").classList.add("active");
      renderChats();
    }

    function renderMessages(messages) {
      const area = document.getElementById("messagesArea");
      area.innerHTML = "";
      messages.forEach(m => {
        const div = document.createElement("div");
        div.className = `msg ${m.type}`;
        div.innerHTML = `
          <div>${m.text}</div>
          <div class="msg-meta">${m.time} ${m.type === "out" ? "✓✓" : ""}</div>
        `;
        area.appendChild(div);
      });
      area.scrollTop = area.scrollHeight;
    }

    function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      const now = new Date();
